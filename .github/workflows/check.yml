name: Egged 870 seat monitor
on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Only send a Telegram test message (no availability check)'
        type: boolean
        default: false
      date:
        description: 'Optional: check this date instead of the two Saturdays (YYYY-MM-DD)'
        required: false
        default: ''
      time:
        description: 'Boarding time at Megiddo Jct for that date (HH:MM)'
        required: false
        default: '19:05'
  schedule:
    # Once an hour at minute 17 (UTC; minute-only cron is the same in every time zone).
    # GitHub does not guarantee exact start times: runs can be delayed, and occasionally dropped, under load.
    - cron: '17 * * * *'
permissions:
  contents: read
  issues: write   # dedup state: one Issue per alerted date
concurrency:
  group: egged-870-monitor
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Telegram test message
        if: inputs.test_telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py --test-telegram
      - name: Check availability (read-only, no seat is reserved)
        if: ${{ !inputs.test_telegram }}
        id: probe
        continue-on-error: true   # UNKNOWN exits 1; still run the notify step for the other date
        env:
          CHECK_DATE: ${{ inputs.date }}
          CHECK_TIME: ${{ inputs.time }}
        run: |
          if [ -n "$CHECK_DATE" ]; then
            python monitor.py --date "$CHECK_DATE" --time "${CHECK_TIME:-19:05}"
          else
            python monitor.py
          fi
      - name: Notify once per OPEN date
        if: always() && !inputs.test_telegram && hashFiles('probe_results.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py
